name: Build GCloud Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GCloudHub-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: ignore
      - name: Publish to Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GCloud Hub - bản mới nhất
          body: |
            Bản tự động build từ nhánh main.
            - Windows: GCloudHub-Setup-x.y.z.exe (bộ cài) hoặc GCloudHub-Portable-x.y.z.exe (chạy ngay).
            - macOS: GCloudHub-x.y.z-arm64.dmg (Apple Silicon) hoặc -x64.dmg (Intel).
          files: |
            dist/*.exe
            dist/*.dmg
          fail_on_unmatched_files: false
